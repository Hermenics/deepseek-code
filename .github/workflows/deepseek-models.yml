name: DeepSeek models & pricing

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deepseek-models
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # Fails (and GitHub notifies the maintainers) when the official page no longer parses.
      - name: Sync from the official pricing page
        run: |
          bun scripts/update-deepseek-models.ts
          node website/scripts/generate-models.js

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/agent/deepseekModels.json website/src/docs/data/deepseek-models.json; then
            echo "No changes."
            exit 0
          fi
          branch=chore/deepseek-models
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "chore(models): sync DeepSeek models and pricing"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --head "$branch" --title "chore(models): sync DeepSeek models and pricing" \
              --body "Automated sync from https://api-docs.deepseek.com/quick_start/pricing. Review the price and model changes before merging. Pull requests opened with the workflow token do not trigger CI; run it from the Actions tab or push a commit to start it."
          fi
